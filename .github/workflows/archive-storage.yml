name: Process requested archive storage job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque Toyo storage job ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: archive-storage-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  storage:
    if: github.repository == 'yack-order/library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: downloader
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install -r downloader/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Process leased storage job
        env:
          TOYO_ARCHIVE_API: https://ui.yackorder.org
          TOYO_ARCHIVE_JOB: ${{ inputs.job_id }}
          TOYO_ARCHIVE_RUNNER_TOKEN: ${{ secrets.TOYO_ARCHIVE_RUNNER_TOKEN }}
        run: python downloader/storage_runner.py
