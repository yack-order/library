name: Build requested media archive
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque Toyo archive job ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: media-archive-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'yack-order/library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: downloader
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare archive disk reserve
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          # Keep the archive inspector's existing expanded-size/free-space checks.
          # This disposable media job does not use the preinstalled Android/.NET SDKs.
          free_bytes=$(df -PB1 "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( free_bytes < 36 * 1024 * 1024 * 1024 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          fi
          df -h "$GITHUB_WORKSPACE"
      - name: Install downloader dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          python -m pip install -r downloader/requirements.txt
      - name: Process claimed job
        env:
          TOYO_ARCHIVE_API: https://ui.yackorder.org
          TOYO_ARCHIVE_JOB: ${{ inputs.job_id }}
          TOYO_ARCHIVE_RUNNER_TOKEN: ${{ secrets.TOYO_ARCHIVE_RUNNER_TOKEN }}
        run: python downloader/runner.py
