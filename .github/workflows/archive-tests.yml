name: Archive and discovery runner tests
on:
  pull_request:
    paths:
      - 'downloader/**'
      - '.github/workflows/space-crawl.yml'
      - '.github/workflows/archive-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: downloader
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r downloader/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s downloader -p 'test_*.py'
