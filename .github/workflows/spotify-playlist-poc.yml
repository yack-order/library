name: Spotify playlist website proof of concept
on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: Public Spotify playlist URL
        required: true
        default: https://open.spotify.com/playlist/7jlh29r2ASMKfqZKgEAuHz
        type: string
      provider:
        description: Website to test
        required: true
        default: both
        type: choice
        options: [both, spotdown, spotidown]
      browser_mode:
        description: Chromium display mode (headed uses Xvfb)
        required: true
        default: headless
        type: choice
        options: [headless, headed]
permissions:
  contents: read
concurrency:
  group: spotify-playlist-poc
  cancel-in-progress: false
jobs:
  experiment:
    if: github.repository == 'yack-order/library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: downloader
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: downloader/requirements.txt
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
          python -m pip install -r downloader/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run offline proof-of-concept tests
        run: python -m unittest discover -s downloader -p 'test_spotify_poc.py'
      - name: Test website downloads and Gofile delivery
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
          PROVIDER: ${{ inputs.provider }}
          BROWSER_MODE: ${{ inputs.browser_mode }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          POC_OUTPUT: ${{ runner.temp }}/spotify-poc-results
        run: xvfb-run --auto-servernum python downloader/spotify_poc.py
      - name: Publish sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotify-poc-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spotify-poc-results/*.json
            ${{ runner.temp }}/spotify-poc-results/spotdown/*.json
            ${{ runner.temp }}/spotify-poc-results/spotdown/*.png
            ${{ runner.temp }}/spotify-poc-results/spotidown/*.json
            ${{ runner.temp }}/spotify-poc-results/spotidown/*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Remove temporary media
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/spotify-poc-results/private"
